name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: oyun_sohbet
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://app:ci_password@127.0.0.1:5432/oyun_sohbet
      TEST_DATABASE_URL: postgresql://app:ci_password@127.0.0.1:5432/oyun_sohbet_test
      REDIS_URL: redis://127.0.0.1:6379
      TEST_REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests
      INTERNAL_API_SECRET: ci-only-internal-secret-long-enough-for-tests
      NEXT_PUBLIC_REALTIME_URL: http://127.0.0.1:4000
      REALTIME_INTERNAL_URL: http://127.0.0.1:4000
      WEB_ORIGIN: http://127.0.0.1:3100
      MATCH_ALLOW_SAME_IP: 'true'
      GUEST_LIMIT_PER_HOUR: '10000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter realtime exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
