# Production stack for a single server. Run from the repository root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Only Caddy is reachable from the internet; every other service stays on the private network.
name: sonoyun

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      realtime:
        condition: service_healthy
    mem_limit: 128m
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_REALTIME_URL: https://${DOMAIN}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${NEXT_PUBLIC_PLAUSIBLE_DOMAIN:-}
    restart: unless-stopped
    env_file: ./web.env
    environment:
      REALTIME_INTERNAL_URL: http://realtime:4000
    depends_on:
      realtime:
        condition: service_healthy
    mem_limit: 512m
    logging: *logging

  realtime:
    build:
      context: ..
      dockerfile: apps/realtime/Dockerfile
    restart: unless-stopped
    env_file: ./realtime.env
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_ORIGIN: https://${DOMAIN}
      TRUST_PROXY: 'true'
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/oyun_sohbet
      REDIS_URL: redis://redis:6379
    volumes:
      # Kept on the server only, so the word list never lands in the public repository.
      - ./badwords.tr.txt:/app/apps/realtime/badwords.tr.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: oyun_sohbet
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d oyun_sohbet']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '200mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
